<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c10"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="16" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    
    <line y1="40" x1="0" y2="40" x2="400"/>
    <line y1="80" x1="0" y2="80" x2="400"/>
    <line y1="120" x1="0" y2="120" x2="400"/>
    <line y1="160" x1="0" y2="160" x2="400"/>
    <line y1="200" x1="0" y2="200" x2="400"/>
    <line y1="240" x1="0" y2="240" x2="400"/>
    <line y1="280" x1="0" y2="280" x2="400"/>
    <line y1="320" x1="0" y2="320" x2="400"/>
    <line y1="360" x1="0" y2="360" x2="400"/>
  </g>

  <!-- Outer HUD Frame -->
  <rect x="25" y="25" width="350" height="350" rx="8" fill="none" stroke="#dc2626" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- HUD Corner Brackets -->
  <!-- Top Left -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="square"/>
  <!-- Top Right -->
  <path d="M 360 20 L 380 20 L 380 40" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="square"/>
  <!-- Bottom Left -->
  <path d="M 20 360 L 20 380 L 40 380" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="square"/>
  <!-- Bottom Right -->
  <path d="M 360 380 L 380 380 L 380 360" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="square"/>

  <!-- QR Inner Canvas -->
  <rect x="50" y="50" width="300" height="300" rx="8" fill="#09090b" stroke="#1f1f23" stroke-width="1"/>

  <!-- Top-Left Finder Pattern -->
  <rect x="70" y="70" width="70" height="70" rx="6" fill="none" stroke="#ef4444" stroke-width="8"/>
  <rect x="85" y="85" width="40" height="40" rx="3" fill="#ef4444"/>

  <!-- Top-Right Finder Pattern -->
  <rect x="260" y="70" width="70" height="70" rx="6" fill="none" stroke="#ef4444" stroke-width="8"/>
  <rect x="275" y="85" width="40" height="40" rx="3" fill="#ef4444"/>

  <!-- Bottom-Left Finder Pattern -->
  <rect x="70" y="260" width="70" height="70" rx="6" fill="none" stroke="#ef4444" stroke-width="8"/>
  <rect x="85" y="275" width="40" height="40" rx="3" fill="#ef4444"/>

  <!-- Matrix Data Pixels (Stylized QR Code Modules) -->
  <g fill="#e4e4e7">
    <!-- Row segments -->
    <rect x="160" y="72" width="12" height="12" rx="2"/>
    <rect x="180" y="72" width="24" height="12" rx="2"/>
    <rect x="220" y="72" width="12" height="12" rx="2"/>
    <rect x="160" y="92" width="24" height="12" rx="2"/>
    <rect x="200" y="92" width="12" height="12" rx="2"/>
    <rect x="230" y="92" width="12" height="12" rx="2"/>
    <rect x="160" y="112" width="12" height="12" rx="2"/>
    <rect x="190" y="112" width="30" height="12" rx="2"/>
    <rect x="230" y="112" width="12" height="12" rx="2"/>
    <rect x="170" y="130" width="12" height="12" rx="2"/>
    <rect x="210" y="130" width="24" height="12" rx="2"/>

    <!-- Middle band -->
    <rect x="72" y="160" width="12" height="12" rx="2"/>
    <rect x="95" y="160" width="24" height="12" rx="2"/>
    <rect x="130" y="160" width="12" height="12" rx="2"/>
    <rect x="150" y="160" width="24" height="12" rx="2"/>
    <rect x="220" y="160" width="12" height="12" rx="2"/>
    <rect x="250" y="160" width="24" height="12" rx="2"/>
    <rect x="290" y="160" width="12" height="12" rx="2"/>
    <rect x="315" y="160" width="15" height="12" rx="2"/>

    <rect x="72" y="180" width="24" height="12" rx="2"/>
    <rect x="110" y="180" width="12" height="12" rx="2"/>
    <rect x="140" y="180" width="12" height="12" rx="2"/>
    <rect x="240" y="180" width="24" height="12" rx="2"/>
    <rect x="280" y="180" width="12" height="12" rx="2"/>
    <rect x="305" y="180" width="25" height="12" rx="2"/>

    <rect x="72" y="200" width="12" height="12" rx="2"/>
    <rect x="100" y="200" width="30" height="12" rx="2"/>
    <rect x="270" y="200" width="30" height="12" rx="2"/>
    <rect x="315" y="200" width="15" height="12" rx="2"/>

    <rect x="80" y="225" width="24" height="12" rx="2"/>
    <rect x="120" y="225" width="12" height="12" rx="2"/>
    <rect x="150" y="225" width="30" height="12" rx="2"/>
    <rect x="220" y="225" width="15" height="12" rx="2"/>
    <rect x="250" y="225" width="30" height="12" rx="2"/>
    <rect x="300" y="225" width="25" height="12" rx="2"/>

    <!-- Bottom Right Quadrant -->
    <rect x="160" y="255" width="24" height="12" rx="2"/>
    <rect x="200" y="255" width="12" height="12" rx="2"/>
    <rect x="230" y="255" width="30" height="12" rx="2"/>
    <rect x="280" y="255" width="12" height="12" rx="2"/>
    <rect x="305" y="255" width="25" height="12" rx="2"/>

    <rect x="160" y="275" width="12" height="12" rx="2"/>
    <rect x="185" y="275" width="25" height="12" rx="2"/>
    <rect x="225" y="275" width="12" height="12" rx="2"/>
    <rect x="250" y="275" width="24" height="12" rx="2"/>
    <rect x="290" y="275" width="35" height="12" rx="2"/>

    <rect x="160" y="295" width="30" height="12" rx="2"/>
    <rect x="205" y="295" width="15" height="12" rx="2"/>
    <rect x="240" y="295" width="20" height="12" rx="2"/>
    <rect x="280" y="295" width="15" height="12" rx="2"/>
    <rect x="310" y="295" width="15" height="12" rx="2"/>

    <rect x="175" y="315" width="12" height="12" rx="2"/>
    <rect x="200" y="315" width="30" height="12" rx="2"/>
    <rect x="250" y="315" width="15" height="12" rx="2"/>
    <rect x="280" y="315" width="45" height="12" rx="2"/>
  </g>

  <!-- Center Badge / Emblem -->
  <rect x="168" y="168" width="64" height="64" rx="8" fill="#18181b" stroke="#ef4444" stroke-width="2"/>
  <!-- Spade Icon & Text -->
  <text x="200" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ef4444" text-anchor="middle" dominant-baseline="middle">♠</text>
  <text x="200" y="218" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">UPI QR</text>

  <!-- Header & Footer labels inside card -->
  <text x="200" y="42" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ef4444" text-anchor="middle" letter-spacing="2">BORDERLAND PAYMENT PROTOCOL</text>
  <text x="200" y="367" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" fill="#71717a" text-anchor="middle" letter-spacing="1.5">SCAN WITH ANY UPI APP</text>
</svg>
